name: Site changed / parser broke
description: justjoin.it changed something and the parser no longer matches.
labels: ["site-change"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most common way a scraper stops working, and it is worth its
        own report because the fix is different from a code bug: something on
        justjoin.it moved.

        Useful to know before filing: the parser reads JSON, not the DOM — the
        `/api/candidate-api/` endpoint by default, or the rendered listing
        page's payload with `--route ssr`. Which route broke narrows the fix a
        lot; the row's `data_source` column says which one it came from.

  - type: dropdown
    id: what_broke
    attributes:
      label: What stopped matching
      options:
        - Offers (0 rows on a query that visibly has offers)
        - A specific field is null or wrong (salary, skills, location, URL)
        - The salary is in the wrong currency or unit
        - Pagination stops early or repeats a page
        - --mode offer or --mode facets returns nothing
        - The captcha detector finds nothing on a page that has one
        - Something else
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: The exact command or URL, the mode and route, and the country your exit IP was in.
      placeholder: "--mode listings --category python (route: api, exit IP: PL residential)"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence from the page
      description: |
        Whichever of these you can get. A capture beats a description.

        - The endpoint response as it is served, e.g. the first record of
          `curl -s "https://justjoin.it/api/candidate-api/offers?..."`
        - Or the `--dump-html` capture of the page.
        - For a field problem: the value you got, and the value on the page.
      render: text
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >-
        Whether it reproduces on a second engine, whether it reproduces from a
        different country, and when it last worked.
